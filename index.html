<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505; --panel-color: #1a1a1a; --text-color: #e0e0e0; --btn-text: #ffffff;
            --accel-color: #00ff66; --brake-color: #ffaa00; --eb-color: #ff0000;
            --pause-bg: rgba(255, 255, 255, 0.4); --pause-text: #000000;
        }
        body.light-mode {
            --bg-color: #f0f0f0; --panel-color: #ffffff; --text-color: #222222; --btn-text: #222222;
            --pause-bg: rgba(0, 0, 0, 0.5); --pause-text: #aaaaaa;
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100dvh; width: 100vw;
            display: flex; flex-direction: column; touch-action: manipulation; position: relative;
        }
        body.is-paused::after {
            content: "PAUSE"; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--pause-bg); display: flex; align-items: center; justify-content: center;
            font-size: 5rem; font-weight: 900; letter-spacing: 1rem; color: var(--pause-text); z-index: 1000; backdrop-filter: blur(2px);
        }
        .header-area { height: 55px; display: flex; justify-content: flex-end; align-items: center; padding: 0 20px; gap: 10px; flex-shrink: 0; z-index: 1100; }
        .util-btn { background: var(--panel-color); color: var(--text-color); border: 2px solid #555; padding: 6px 12px; border-radius: 8px; font-size: 1rem; font-weight: 900; cursor: pointer; }
        .display-container { flex: 1; display: grid; grid-template-columns: 1fr 2fr 1fr; padding: 0 25px; align-items: center; min-height: 0; }
        .limit-speed { color: #ff4444; font-size: 4.2rem; font-weight: bold; line-height: 1; }
        .center-dash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        #notch-text { font-size: 3.5rem; font-weight: bold; line-height: 1; }
        .main-speed { font-size: 10rem; font-weight: 800; line-height: 0.75; }
        .speed-unit { font-size: 2rem; color: #666; }
        .meter-container { width: 100%; height: 24px; background: #333; border-radius: 6px; border: 2px solid #555; overflow: hidden; }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }
        .right-info { text-align: right; display: flex; flex-direction: column; gap: 4px; }
        #judgment { font-size: 2.2rem; font-weight: 900; height: 2.4rem; margin-top: 5px; }
        .control-container { height: 220px; display: flex; align-items: center; justify-content: center; gap: 15px; padding: 10px 20px 30px 20px; box-sizing: border-box; flex-shrink: 0; }
        .notch-btn { flex: 1; background: var(--panel-color); color: var(--btn-text); border: 2px solid #555; border-radius: 20px; font-size: 2.8rem; font-weight: bold; height: 100%; }
        .eb-btn-small { width: 85px; height: 85px; background: #aa0000; border: 4px solid #440000; border-radius: 50%; color: white; font-size: 1.4rem; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #550000; flex-shrink: 0; margin-bottom: 20px; }
        .eb-btn-small.eb-on { background: #ff0000; box-shadow: 0 0 25px #ff0000; border-color: #ffaaaa; transform: scale(1.05); }
    </style>
</head>
<body ontouchstart="">
    <div class="header-area">
        <button class="util-btn" style="color:#ff4444; border-color:#800;" onpointerdown="resetGame()">最初から</button>
        <button class="util-btn" onpointerdown="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onpointerdown="togglePause()">Pause</button>
    </div>
    <div class="display-container">
        <div class="info-box">
            <span style="font-size:1.2rem; color:#888; font-weight: bold;">制限</span>
            <span id="limit" class="limit-speed">--</span>
        </div>
        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="main-speed"><span id="speed">0</span><span class="speed-unit"> km/h</span></div>
            <div class="meter-container"><div id="notch-bar"></div></div>
        </div>
        <div class="right-info">
            <div style="color:var(--accel-color); font-weight:bold; font-size: 1.6rem;">NEXT: <span id="next-name">---</span></div>
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.4rem;">9431M Expo Liner</div>
            <div style="color:#aaa; font-size: 1.1rem;">Osaka → Sakurajima</div>
            <div id="judgment"></div>
            <div id="distance" style="font-size: 2.8rem; margin-top:4px; font-weight: bold;">-- m</div>
        </div>
    </div>
    <div class="control-container">
        <button class="notch-btn" onpointerdown="changeNotch(1)">▲ 加速</button>
        <button id="eb-btn" class="eb-btn-small" onpointerdown="handleEB()">EB</button>
        <button class="notch-btn" onpointerdown="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        
        const PARAMS = { accel_power: 0.04, brake_power: 0.045, eb_power: 0.065, friction: 0.003, refresh_ms: 50 };
        const STATIONS = [{ name: "大阪", dist: 0 }, { name: "西九条", dist: 3800 }, { name: "安治川口", dist: 5400 }, { name: "ユニバーサルシティ", dist: 6600 }, { name: "桜島", dist: 7800 }];
        
        let speed = 0, currentPos = 0, notch = -5, isPaused = false, nextStationIdx = 1, lastNotch = 0, hasStopped = false;

        function resetGame() {
            if (confirm("シミュレーションを最初からやり直しますか？")) {
                speed = 0; currentPos = 0; notch = -5; nextStationIdx = 1; hasStopped = false;
                document.getElementById('judgment').innerText = "";
                updateUI();
            }
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function togglePause() { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause'; document.body.classList.toggle('is-paused', isPaused); }
        function changeNotch(val) { if (isPaused || notch === -9) return; notch += val; if (notch > 5) notch = 5; if (notch < -8) notch = -8; updateUI(); }

        function handleEB() {
            if (isPaused) return;
            let currentLimit = parseInt(document.getElementById('limit').innerText);
            if (notch === -9) { if (speed <= currentLimit || speed === 0) { notch = lastNotch; } }
            else { lastNotch = notch; notch = -9; }
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar'), txt = document.getElementById('notch-text'), ebBtn = document.getElementById('eb-btn');
            if (notch === -9) {
                bar.style.width = "100%"; bar.style.backgroundColor = "var(--eb-color)"; txt.innerText = "EB"; txt.style.color = "var(--eb-color)"; ebBtn.classList.add('eb-on');
            } else {
                ebBtn.classList.remove('eb-on');
                if (notch > 0) { bar.style.width = (notch/5)*100+"%"; bar.style.backgroundColor = "var(--accel-color)"; txt.innerText = "P"+notch; txt.style.color = "var(--accel-color)"; }
                else if (notch < 0) { bar.style.width = (Math.abs(notch)/8)*100+"%"; bar.style.backgroundColor = "var(--brake-color)"; txt.innerText = "B"+Math.abs(notch); txt.style.color = "var(--brake-color)"; }
                else { bar.style.width = "0%"; txt.innerText = "N"; txt.style.color = "var(--text-color)"; }
            }
        }

        setInterval(() => {
            if (isPaused) return;
            if (notch > 0) speed += notch * PARAMS.accel_power; 
            else if (notch < 0) speed += notch * ((notch === -9) ? PARAMS.eb_power : (PARAMS.brake_power/8));
            speed -= PARAMS.friction;

            // 停車・発車判定の強化
            if (speed < 0.1) {
                if (speed > 0 && !hasStopped) { checkStopJudgment(); hasStopped = true; }
                speed = 0;
            } else if (speed >= 1.0) { // 1km/h以上で完全に判定をリセット
                if (hasStopped || document.getElementById('judgment').innerText !== "") {
                    document.getElementById('judgment').innerText = "";
                    hasStopped = false;
                }
            }
            
            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            let nextStation = STATIONS[nextStationIdx], distToNext = nextStation.dist - currentPos;
            let currentLimit = (distToNext < 300) ? 25 : (distToNext < 800) ? 45 : 95;

            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('limit').innerText = currentLimit;
            document.getElementById('next-name').innerText = nextStation.name;

            const distEl = document.getElementById('distance');
            if (Math.abs(distToNext) <= 5) { distEl.innerText = (distToNext * 100).toFixed(1) + " cm"; distEl.style.color = "#fff"; }
            else { distEl.innerText = Math.floor(distToNext) + " m"; distEl.style.color = ""; }

            if (speed > currentLimit && notch !== -9) { lastNotch = notch; notch = -9; updateUI(); }
            if (notch === -9 && speed <= currentLimit - 20 && speed > 0) { notch = lastNotch; updateUI(); }

            // 駅切り替え (15m以上離れたらリセット)
            if (distToNext < -15 && nextStationIdx < STATIONS.length - 1) {
                nextStationIdx++;
                document.getElementById('judgment').innerText = "";
                hasStopped = false;
            }
        }, PARAMS.refresh_ms);

        function checkStopJudgment() {
            let diff = Math.abs(STATIONS[nextStationIdx].dist - currentPos) * 100;
            let judgeEl = document.getElementById('judgment');
            if (diff < 10) { judgeEl.innerText = "EXCELLENT"; judgeEl.style.color = "#00ffff"; }
            else if (diff < 30) { judgeEl.innerText = "GREAT"; judgeEl.style.color = "var(--accel-color)"; }
            else if (diff < 100) { judgeEl.innerText = "GOOD"; judgeEl.style.color = "#fff"; }
            else { judgeEl.innerText = "BAD"; judgeEl.style.color = "var(--eb-color)"; }
        }
        updateUI();
    </script>
</body>
</html>
