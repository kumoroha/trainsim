<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #1a1a1a;
            --text-color: #e0e0e0;
            --btn-text: #ffffff;
            --accel-color: #00ff66;
            --brake-color: #ffaa00;
            --eb-color: #ff0000;
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-color: #ffffff;
            --text-color: #222222;
            --btn-text: #222222;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; /* スクロール禁止 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ユーティリティボタン：絶対配置から通常の流れに変更して隠れるのを防止 */
        .utils {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 10px;
            height: 40px;
        }
        .util-btn {
            background: var(--panel-color);
            color: var(--text-color);
            border: 1px solid #555;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        /* 上部計器エリア：高さを少し抑える */
        .display-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            flex: 0 0 35%; /* 画面の35%を占有 */
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .info-box { display: flex; flex-direction: column; justify-content: center; }
        .limit-speed { color: #ff4444; font-size: 3.5rem; font-weight: bold; line-height: 1; }
        
        .center-dash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .speed-display-group { display: flex; align-items: baseline; }
        .main-speed { font-size: 7rem; font-weight: 800; line-height: 1; }
        .speed-unit { font-size: 1.2rem; color: #666; margin-left: 8px; }

        #notch-text { font-size: 2rem; font-weight: bold; margin-bottom: 2px; height: 2.2rem; }

        .meter-container {
            width: 90%;
            height: 20px;
            background: #333;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid #555;
        }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }

        /* 下部：操作エリア */
        .control-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1; /* 残りのスペースをすべて使う */
            gap: 15px;
            padding: 10px 20px 30px 20px; /* 下部余白を適切に確保 */
            box-sizing: border-box;
        }

        .notch-btn {
            background: var(--panel-color);
            color: var(--btn-text);
            border: 2px solid #555;
            border-radius: 20px;
            font-size: 2.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            height: 100%; /* 親要素内で最大化 */
        }
        .notch-btn:active { transform: scale(0.97); background: #444; }

    </style>
</head>
<body>

    <div class="utils">
        <button class="util-btn" onclick="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onclick="togglePause()">Pause</button>
    </div>

    <div class="display-container">
        <div class="info-box">
            <span style="font-size:0.8rem; color:#888;">制限</span>
            <span id="limit" class="limit-speed">--</span>
        </div>

        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="speed-display-group">
                <div id="speed" class="main-speed">0</div>
                <div class="speed-unit">km/h</div>
            </div>
            <div class="meter-container">
                <div id="notch-bar"></div>
            </div>
        </div>

        <div class="info-box" style="text-align:right; line-height: 1.3;">
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.1rem;">9431M エキスポライナー</div>
            <div id="section-name" style="color:#aaa; font-size: 0.8rem;">大阪 → 西九条</div>
            <div id="distance" style="font-size: 1.8rem; margin-top:10px; font-weight: bold;">-- km</div>
        </div>
    </div>

    <div class="control-container">
        <button class="notch-btn" onclick="changeNotch(1)">▲ 加速</button>
        <button class="notch-btn" onclick="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        const PARAMS = {
            accel_power: 0.04,
            brake_power: 0.07,
            eb_power: 0.25,
            friction: 0.003,
            refresh_ms: 50
        };

        const STATIONS = [
            { name: "大阪", dist: 0 },
            { name: "西九条", dist: 3800 },
            { name: "安治川口", dist: 5400 },
            { name: "ユニバーサルシティ", dist: 6600 },
            { name: "桜島", dist: 7800 }
        ];

        let speed = 0;
        let currentPos = 0;
        let notch = 0;
        let isPaused = false;
        let nextStationIdx = 1;

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
            document.getElementById('pause-btn').style.backgroundColor = isPaused ? '#ff4444' : '';
        }

        function changeNotch(val) {
            if (isPaused) return;
            notch += val;
            if (notch > 5) notch = 5;
            if (notch < -9) notch = -9;
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar');
            const txt = document.getElementById('notch-text');
            if (notch > 0) {
                bar.style.width = (notch / 5) * 100 + "%";
                bar.style.backgroundColor = "var(--accel-color)";
                txt.innerText = "P" + notch;
                txt.style.color = "var(--accel-color)";
            } else if (notch < 0) {
                let isEB = (notch === -9);
                bar.style.width = (Math.abs(notch) / 9) * 100 + "%";
                bar.style.backgroundColor = isEB ? "var(--eb-color)" : "var(--brake-color)";
                txt.innerText = isEB ? "EB" : "B" + Math.abs(notch);
                txt.style.color = isEB ? "var(--eb-color)" : "var(--brake-color)";
            } else {
                bar.style.width = "0%";
                txt.innerText = "N";
                txt.style.color = "var(--text-color)";
            }
        }

        setInterval(() => {
            if (isPaused) return;

            if (notch > 0) speed += notch * PARAMS.accel_power;
            else if (notch < 0) {
                let power = (notch === -9) ? PARAMS.eb_power : PARAMS.brake_power;
                speed += notch * power;
            }
            speed -= PARAMS.friction;
            if (speed < 0) speed = 0;

            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            
            let nextStation = STATIONS[nextStationIdx];
            let distToNext = nextStation.dist - currentPos;

            if (distToNext < 0) {
                if (nextStationIdx < STATIONS.length - 1) {
                    nextStationIdx++;
                    nextStation = STATIONS[nextStationIdx];
                    distToNext = nextStation.dist - currentPos;
                } else {
                    distToNext = 0;
                    speed = 0;
                }
            }

            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('distance').innerText = (distToNext / 1000).toFixed(2) + " km";
            document.getElementById('section-name').innerText = STATIONS[nextStationIdx-1].name + " → " + nextStation.name;

            if (distToNext < 300) document.getElementById('limit').innerText = "25";
            else if (distToNext < 800) document.getElementById('limit').innerText = "45";
            else document.getElementById('limit').innerText = "95";

        }, PARAMS.refresh_ms);

        updateUI();
    </script>
</body>
</html>
