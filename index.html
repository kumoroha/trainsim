<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #1a1a1a;
            --text-color: #e0e0e0;
            --btn-text: #ffffff;
            --accel-color: #00ff66;
            --brake-color: #ffaa00;
            --eb-color: #ff0000;
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-color: #ffffff;
            --text-color: #222222;
            --btn-text: #222222;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            /* タッチ操作の挙動を制限（ダブルタップズーム無効化のCSS） */
            touch-action: manipulation;
        }

        /* 1. ユーティリティ（最上部：5vh） */
        .utils {
            height: 8vh;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            box-sizing: border-box;
            background: rgba(255,255,255,0.05);
        }
        .util-btn {
            background: var(--panel-color);
            color: var(--text-color);
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        /* 2. 計器表示（中央：42vh） */
        .display-container {
            height: 42vh;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .info-box { display: flex; flex-direction: column; justify-content: center; }
        .limit-speed { color: #ff4444; font-size: 3rem; font-weight: bold; }
        
        .center-dash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-speed { font-size: 6rem; font-weight: 800; line-height: 1; }
        .speed-unit { font-size: 1.2rem; color: #666; }
        #notch-text { font-size: 2rem; font-weight: bold; height: 2.2rem; }

        .meter-container {
            width: 90%;
            height: 18px;
            background: #333;
            border-radius: 4px;
            margin-top: 10px;
            border: 1px solid #555;
            overflow: hidden;
        }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }

        /* 3. 操作パネル（下部：50vh） */
        .control-container {
            height: 50vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 10px 20px 40px 20px; /* 下部40pxはiPadホームバー用 */
            box-sizing: border-box;
        }

        .notch-btn {
            background: var(--panel-color);
            color: var(--btn-text);
            border: 2px solid #555;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ボタンが大きすぎないように最大高さを制限 */
            max-height: 200px; 
            align-self: center; 
            height: 80%;
        }

    </style>
</head>
<body ontouchstart=""> <div class="utils">
        <button class="util-btn" onclick="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onclick="togglePause()">Pause</button>
    </div>

    <div class="display-container">
        <div class="info-box">
            <span style="font-size:0.8rem; color:#888;">制限</span>
            <span id="limit" class="limit-speed">--</span>
        </div>

        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="main-speed"><span id="speed">0</span><span class="speed-unit"> km/h</span></div>
            <div class="meter-container">
                <div id="notch-bar"></div>
            </div>
        </div>

        <div class="info-box" style="text-align:right; line-height: 1.2;">
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1rem;">9431M エキスポライナー</div>
            <div id="section-name" style="color:#aaa; font-size: 0.8rem;">大阪 → 西九条</div>
            <div id="distance" style="font-size: 1.6rem; margin-top:5px; font-weight: bold;">-- km</div>
        </div>
    </div>

    <div class="control-container">
        <button class="notch-btn" onclick="changeNotch(1)">▲ 加速</button>
        <button class="notch-btn" onclick="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        // ダブルタップズームをJS側でも徹底防御
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        const PARAMS = { accel_power: 0.04, brake_power: 0.07, eb_power: 0.25, friction: 0.003, refresh_ms: 50 };
        const STATIONS = [
            { name: "大阪", dist: 0 },
            { name: "西九条", dist: 3800 },
            { name: "安治川口", dist: 5400 },
            { name: "ユニバーサルシティ", dist: 6600 },
            { name: "桜島", dist: 7800 }
        ];

        let speed = 0, currentPos = 0, notch = 0, isPaused = false, nextStationIdx = 1;

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
            document.getElementById('pause-btn').style.backgroundColor = isPaused ? '#ff4444' : '';
        }

        function changeNotch(val) {
            if (isPaused) return;
            notch += val;
            if (notch > 5) notch = 5;
            if (notch < -9) notch = -9;
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar'), txt = document.getElementById('notch-text');
            if (notch > 0) {
                bar.style.width = (notch / 5) * 100 + "%";
                bar.style.backgroundColor = "var(--accel-color)";
                txt.innerText = "P" + notch;
                txt.style.color = "var(--accel-color)";
            } else if (notch < 0) {
                let isEB = (notch === -9);
                bar.style.width = (Math.abs(notch) / 9) * 100 + "%";
                bar.style.backgroundColor = isEB ? "var(--eb-color)" : "var(--brake-color)";
                txt.innerText = isEB ? "EB" : "B" + Math.abs(notch);
                txt.style.color = isEB ? "var(--eb-color)" : "var(--brake-color)";
            } else {
                bar.style.width = "0%";
                txt.innerText = "N";
                txt.style.color = "var(--text-color)";
            }
        }

        setInterval(() => {
            if (isPaused) return;
            if (notch > 0) speed += notch * PARAMS.accel_power;
            else if (notch < 0) speed += notch * ((notch === -9) ? PARAMS.eb_power : PARAMS.brake_power);
            speed -= PARAMS.friction;
            if (speed < 0) speed = 0;
            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            let nextStation = STATIONS[nextStationIdx], distToNext = nextStation.dist - currentPos;
            if (distToNext < 0) {
                if (nextStationIdx < STATIONS.length - 1) {
                    nextStationIdx++;
                    nextStation = STATIONS[nextStationIdx];
                    distToNext = nextStation.dist - currentPos;
                } else { distToNext = 0; speed = 0; }
            }
            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('distance').innerText = (distToNext / 1000).toFixed(2) + " km";
            document.getElementById('section-name').innerText = STATIONS[nextStationIdx-1].name + " → " + nextStation.name;
            if (distToNext < 300) document.getElementById('limit').innerText = "25";
            else if (distToNext < 800) document.getElementById('limit').innerText = "45";
            else document.getElementById('limit').innerText = "95";
        }, PARAMS.refresh_ms);
        updateUI();
    </script>
</body>
</html>
