<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #1a1a1a;
            --text-color: #e0e0e0;
            --btn-text: #ffffff;
            --accel-color: #00ff66;
            --brake-color: #ffaa00;
            --eb-color: #ff0000;
            --pause-overlay: rgba(255, 255, 255, 0.2); /* ダークモード時は白っぽく */
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-color: #ffffff;
            --text-color: #222222;
            --btn-text: #222222;
            --pause-overlay: rgba(0, 0, 0, 0.2); /* ライトモード時は暗く */
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            position: relative;
        }

        /* Pause状態の視覚効果：擬似要素で画面全体を覆う */
        body.is-paused::after {
            content: "PAUSE";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--pause-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.5rem;
            color: var(--text-color);
            z-index: 1000;
            pointer-events: none; /* 下のボタン操作を邪魔しない（Pause解除ボタンのため） */
        }

        .utils {
            height: 50px; 
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 1100; /* Pauseオーバーレイより上に */
        }
        .util-btn {
            background: var(--panel-color);
            color: var(--text-color);
            border: 2px solid #555;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
        }

        .display-container {
            flex: 1; 
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            padding: 0 25px;
            align-items: center;
            min-height: 0;
        }

        .limit-speed { color: #ff4444; font-size: 4.2rem; font-weight: bold; line-height: 1; }
        
        .center-dash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        #notch-text { font-size: 3.8rem; font-weight: bold; line-height: 1; }
        .main-speed { font-size: 10rem; font-weight: 800; line-height: 0.75; }
        .speed-unit { font-size: 2rem; color: #666; }

        .meter-container {
            width: 100%; height: 24px;
            background: #333;
            border-radius: 6px;
            border: 2px solid #555;
            overflow: hidden;
        }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }

        .control-container {
            height: 220px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 10px 20px 30px 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .notch-btn {
            flex: 1;
            background: var(--panel-color);
            color: var(--btn-text);
            border: 2px solid #555;
            border-radius: 20px;
            font-size: 2.8rem;
            font-weight: bold;
            height: 100%;
        }

        .eb-btn-small {
            width: 85px; height: 85px;
            background: #aa0000;
            border: 4px solid #440000;
            border-radius: 50%;
            color: white;
            font-size: 1.4rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #550000;
            flex-shrink: 0;
            margin-bottom: 20px;
        }
        
        .eb-btn-small.eb-on {
            background: #ff0000;
            box-shadow: 0 0 25px #ff0000;
            border-color: #ffaaaa;
            transform: scale(1.05);
        }

    </style>
</head>
<body ontouchstart="">

    <div class="utils">
        <button class="util-btn" onpointerdown="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onpointerdown="togglePause()">Pause</button>
    </div>

    <div class="display-container">
        <div class="info-box">
            <span style="font-size:1.2rem; color:#888; font-weight: bold;">制限</span>
            <span id="limit" class="limit-speed">--</span>
        </div>

        <div class="center-dash">
            <div id="notch-text">N</div>
            <div id="speed-display" class="main-speed"><span id="speed">0</span><span class="speed-unit"> km/h</span></div>
            <div class="meter-container">
                <div id="notch-bar"></div>
            </div>
        </div>

        <div class="info-box" style="text-align:right;">
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.4rem;">9431M Expo Liner</div>
            <div id="section-name" style="color:#aaa; font-size: 1.1rem;">Osaka → Nishi-Kujo</div>
            <div id="distance" style="font-size: 2.5rem; margin-top:8px; font-weight: bold;">-- m</div>
        </div>
    </div>

    <div class="control-container">
        <button class="notch-btn" onpointerdown="changeNotch(1)">▲ 加速</button>
        <button id="eb-btn" class="eb-btn-small" onpointerdown="handleEB()">EB</button>
        <button class="notch-btn" onpointerdown="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        const PARAMS = { accel_power: 0.04, brake_power: 0.07, eb_power: 0.18, friction: 0.003, refresh_ms: 50 };
        const STATIONS = [
            { name: "大阪", dist: 0 }, { name: "西九条", dist: 3800 },
            { name: "安治川口", dist: 5400 }, { name: "ユニバーサルシティ", dist: 6600 },
            { name: "桜島", dist: 7800 }
        ];

        let speed = 0, currentPos = 0, notch = -5, isPaused = false, nextStationIdx = 1;
        let lastNotch = 0;

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
            document.body.classList.toggle('is-paused', isPaused);
        }

        function changeNotch(val) {
            if (isPaused || notch === -9) return;
            notch += val;
            if (notch > 5) notch = 5;
            if (notch < -8) notch = -8;
            updateUI();
        }

        function handleEB() {
            if (isPaused) return;
            if (notch === -9) {
                notch = lastNotch; 
            } else {
                lastNotch = notch; 
                notch = -9;
            }
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar'), 
                  txt = document.getElementById('notch-text'),
                  ebBtn = document.getElementById('eb-btn');

            if (notch === -9) {
                bar.style.width = "100%";
                bar.style.backgroundColor = "var(--eb-color)";
                txt.innerText = "EB";
                txt.style.color = "var(--eb-color)";
                ebBtn.classList.add('eb-on');
            } else {
                ebBtn.classList.remove('eb-on');
                if (notch > 0) {
                    bar.style.width = (notch / 5) * 100 + "%";
                    bar.style.backgroundColor = "var(--accel-color)";
                    txt.innerText = "P" + notch;
                    txt.style.color = "var(--accel-color)";
                } else if (notch < 0) {
                    bar.style.width = (Math.abs(notch) / 8) * 100 + "%";
                    bar.style.backgroundColor = "var(--brake-color)";
                    txt.innerText = "B" + Math.abs(notch);
                    txt.style.color = "var(--brake-color)";
                } else {
                    bar.style.width = "0%";
                    txt.innerText = "N";
                    txt.style.color = "var(--text-color)";
                }
            }
        }

        setInterval(() => {
            if (isPaused) return;
            
            if (notch > 0) speed += notch * PARAMS.accel_power;
            else if (notch < 0) speed += notch * ((notch === -9) ? PARAMS.eb_power : PARAMS.brake_power);
            speed -= PARAMS.friction;
            if (speed < 0) speed = 0;
            
            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            let nextStation = STATIONS[nextStationIdx], distToNext = nextStation.dist - currentPos;
            let limit = (distToNext < 300) ? 25 : (distToNext < 800) ? 45 : 95;

            if (speed > limit && notch !== -9) {
                lastNotch = notch; 
                notch = -9;
                updateUI();
            }

            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('distance').innerText = Math.floor(distToNext) + " m";
            document.getElementById('limit').innerText = limit;
            document.getElementById('section-name').innerText = STATIONS[nextStationIdx-1].name + " → " + nextStation.name;

            if (distToNext < 0 && nextStationIdx < STATIONS.length - 1) nextStationIdx++;
        }, PARAMS.refresh_ms);
        updateUI();
    </script>
</body>
</html>
