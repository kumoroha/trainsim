<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expo Liner Simulator Pro 2.47</title>
    <style>
        :root {
            --bg-color: #050505; --panel-color: #1a1a1a; --text-color: #e0e0e0; --btn-text: #ffffff;
            --accel-color: #00ff66; --brake-color: #ffaa00; --eb-color: #ff0000;
            --pause-bg: rgba(255, 255, 255, 0.2); --pause-text: #ffffff;
        }
        body.light-mode {
            --bg-color: #b0b0b0; --panel-color: #e0e0e0; --text-color: #1a1a1a; --btn-text: #1a1a1a;
            --pause-bg: rgba(0, 0, 0, 0.6); --pause-text: #ffffff;
        }

        html, body { overflow: hidden; width: 100%; height: 100%; position: fixed; }
        * { touch-action: none !important; -webkit-text-size-adjust: none; user-select: none; outline: none; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', sans-serif; height: 100dvh; width: 100vw;
            display: flex; flex-direction: column; position: relative;
        }

        body.is-paused::after {
            content: "PAUSE"; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--pause-bg); display: flex; align-items: center; justify-content: center;
            font-size: 5rem; font-weight: 900; letter-spacing: 1rem; color: var(--pause-text); z-index: 2000; backdrop-filter: blur(5px);
        }
        
        .header-area { height: 60px; display: flex; justify-content: flex-end; align-items: center; padding: 0 15px; gap: 8px; flex-shrink: 0; z-index: 2100; }
        .util-btn { background: var(--panel-color); color: var(--text-color); border: 2.5px solid #666; padding: 8px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: bold; }
        
        .display-container { flex: 1; display: grid; grid-template-columns: 1.2fr 2fr 1fr; padding: 0 15px; align-items: center; gap: 5px; }
        
        .limit-area { display: flex; flex-direction: column; gap: 5px; }
        .limit-main { display: flex; flex-direction: column; }
        .limit-speed { color: #ff3333; font-size: 3.8rem; font-weight: bold; line-height: 1; }
        .limit-next { background: rgba(255,68,68,0.1); border-left: 3px solid #ff4444; padding: 4px 8px; font-size: 0.9rem; color: #ff8888; font-weight: bold; }

        .center-dash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        #notch-text { font-size: 3rem; font-weight: bold; line-height: 1; }
        .main-speed { font-size: 8rem; font-weight: 800; line-height: 0.75; }
        .speed-unit { font-size: 1.8rem; color: #555; }
        .meter-container { width: 100%; height: 24px; background: #333; border-radius: 6px; border: 2px solid #555; overflow: hidden; }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }
        
        .right-info { text-align: right; display: flex; flex-direction: column; gap: 4px; }
        .train-info-small { font-size: 0.9rem; font-weight: bold; opacity: 0.8; }
        
        .control-container { height: 240px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 15px 30px 15px; box-sizing: border-box; flex-shrink: 0; }
        .notch-btn { flex: 1; background: var(--panel-color); color: var(--btn-text); border: 3px solid #666; border-radius: 20px; font-size: 2rem; font-weight: bold; height: 100%; }
        .eb-btn-small { width: 110px; height: 110px; background: #aa0000; border: 5px solid #440000; border-radius: 50%; color: white; font-size: 1.6rem; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #550000; flex-shrink: 0; margin-bottom: 20px; z-index: 10; }
        .eb-btn-small.eb-on { background: #ff0000; box-shadow: 0 0 30px #ff0000; border-color: #ffaaaa; transform: scale(1.05); }
    </style>
</head>
<body ontouchstart="">
    <div class="header-area">
        <button class="util-btn" style="color:#ff2222; border-color:#a22;" onpointerdown="resetGame()">最初から</button>
        <button class="util-btn" onpointerdown="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onpointerdown="togglePause()">Pause</button>
    </div>
    <div class="display-container">
        <div class="limit-area">
            <div class="limit-main">
                <span style="font-size:0.9rem; font-weight: bold; opacity: 0.7;">現在の制限</span>
                <span id="limit" class="limit-speed">--</span>
            </div>
            <div id="next-limit-box" class="limit-next">
                NEXT <span id="next-limit-val">--</span><br>
                あと <span id="next-limit-dist">--</span>m
            </div>
        </div>
        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="main-speed"><span id="speed">0</span><span class="speed-unit">km/h</span></div>
            <div class="meter-container"><div id="notch-bar"></div></div>
        </div>
        <div class="right-info">
            <div style="color:var(--accel-color); font-weight:bold; font-size: 1.3rem;">NEXT: <span id="next-name">---</span></div>
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.1rem;">9431M Expo Liner</div>
            <div class="train-info-small">Osaka → Sakurajima</div>
            <div id="distance" style="font-size: 2.5rem; font-weight: bold;">-- m</div>
        </div>
    </div>
    <div class="control-container">
        <button class="notch-btn" onpointerdown="changeNotch(1)">▲ 加速</button>
        <button id="eb-btn" class="eb-btn-small" onpointerdown="handleEB()">EB</button>
        <button class="notch-btn" onpointerdown="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        const PARAMS = { 
            accel_unit: 0.028, 
            brake_unit: 0.44,  
            eb_power: 0.195,   
            friction: 0.003, 
            refresh_ms: 50 
        };
        const STATIONS = [{ name: "大阪", dist: 0 }, { name: "西九条", dist: 3800 }, { name: "安治川口", dist: 5400 }, { name: "ユニバーサルシティ", dist: 6600 }, { name: "桜島", dist: 7800 }];
        
        let speed = 0, currentPos = 0, notch = -5, isPaused = false, nextStationIdx = 1, hasStopped = false, isStationProcess = false;

        function resetGame() {
            if (confirm("最初からやり直しますか？")) {
                location.reload();
            }
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function togglePause() { 
            isPaused = !isPaused; 
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
            document.body.classList.toggle('is-paused', isPaused);
        }
        
        function changeNotch(val) { 
            if (isPaused || isStationProcess) return; 
            if (val > 0) { 
                if (notch === -9) {
                    let cLim = parseInt(document.getElementById('limit').innerText) || 95;
                    if (Math.floor(speed) <= cLim) notch = -8;
                } else { notch += val; }
            } else { 
                notch += val;
                if (notch < -9) notch = -9;
            }
            if (notch > 5) notch = 5;
            updateUI(); 
        }

        function handleEB() {
            if (isPaused || isStationProcess) return;
            if (notch === -9) {
                let cLim = parseInt(document.getElementById('limit').innerText) || 95;
                if (Math.floor(speed) <= cLim) notch = 0;
            } else { notch = -9; }
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar'), txt = document.getElementById('notch-text'), ebBtn = document.getElementById('eb-btn');
            if (notch === -9) {
                bar.style.width = "100%"; bar.style.backgroundColor = "var(--eb-color)"; 
                txt.innerText = "EB"; txt.style.color = "var(--eb-color)"; ebBtn.classList.add('eb-on');
            } else {
                ebBtn.classList.remove('eb-on');
                if (notch > 0) { 
                    bar.style.width = (notch/5)*100+"%"; bar.style.backgroundColor = "var(--accel-color)"; 
                    txt.innerText = "P"+notch; txt.style.color = "var(--accel-color)"; 
                } else if (notch < 0) { 
                    bar.style.width = (Math.abs(notch)/8)*100+"%"; bar.style.backgroundColor = "var(--brake-color)"; 
                    txt.innerText = "B"+Math.abs(notch); txt.style.color = "var(--brake-color)"; 
                } else { 
                    bar.style.width = "0%"; txt.innerText = "N"; txt.style.color = "var(--text-color)"; 
                }
            }
        }

        setInterval(() => {
            if (isPaused || isStationProcess) return;

            if (notch > 0) {
                speed += notch * PARAMS.accel_unit;
            } else if (notch < 0) {
                let decel = (notch === -9) ? PARAMS.eb_power : (Math.abs(notch) * (PARAMS.brake_unit / 8));
                speed -= decel;
            }
            speed -= PARAMS.friction;

            if (speed < 0.1) {
                if (speed > 0 && !hasStopped) { 
                    hasStopped = true;
                    processArrival();
                }
                speed = 0;
            } else if (speed >= 0.5) {
                hasStopped = false;
            }
            
            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            let nextS = STATIONS[nextStationIdx], dNext = nextS.dist - currentPos;
            
            let cLimit = 95;
            let nLimit = "--";
            let nLimDist = "--";

            if (dNext < 300) { cLimit = 25; nLimit = "終了"; nLimDist = "停車"; }
            else if (dNext < 800) { cLimit = 45; nLimit = "25"; nLimDist = Math.floor(dNext - 300); }
            else { cLimit = 95; nLimit = "45"; nLimDist = Math.floor(dNext - 800); }

            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('limit').innerText = cLimit;
            document.getElementById('next-limit-val').innerText = nLimit + (nLimit === "終了" ? "" : "km/h");
            document.getElementById('next-limit-dist').innerText = nLimDist;
            document.getElementById('next-name').innerText = nextS.name;

            const distEl = document.getElementById('distance');
            if (Math.abs(dNext) <= 5) { distEl.innerText = (dNext * 100).toFixed(1) + " cm"; distEl.style.color = "#fff"; }
            else { distEl.innerText = Math.floor(dNext) + " m"; distEl.style.color = ""; }

            if (Math.floor(speed) > cLimit && notch !== -9) { notch = -9; updateUI(); }
        }, PARAMS.refresh_ms);

        function processArrival() {
            isStationProcess = true;
            let diff = Math.abs(STATIONS[nextStationIdx].dist - currentPos) * 100;
            let resultText = "";

            if (diff < 15) { resultText = "EXCELLENT"; }
            else if (diff < 40) { resultText = "GREAT"; }
            else if (diff < 150) { resultText = "GOOD"; }
            else { resultText = "BAD"; }

            setTimeout(() => {
                alert("結果は " + resultText + " です (" + (diff/100).toFixed(2) + "m)");
                
                if (nextStationIdx < STATIONS.length - 1) {
                    nextStationIdx++;
                    notch = -5;
                    updateUI();
                    isStationProcess = false;
                } else {
                    alert("終点 桜島に到着しました。お疲れ様でした！");
                }
            }, 2000);
        }
        updateUI();
    </script>
</body>
</html>
