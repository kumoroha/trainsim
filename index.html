<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505; --panel-color: #1a1a1a; --text-color: #e0e0e0; --btn-text: #ffffff;
            --accel-color: #00ff66; --brake-color: #ffaa00; --eb-color: #ff0000;
        }
        body.light-mode {
            --bg-color: #f0f0f0; --panel-color: #ffffff; --text-color: #222222; --btn-text: #222222;
        }

        /* 拡大・スクロール・選択の完全禁止 */
        html, body { overflow: hidden; width: 100%; height: 100%; position: fixed; }
        * { 
            touch-action: none !important; 
            -webkit-text-size-adjust: none; 
            user-select: none; 
            -webkit-user-select: none;
        }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Segoe UI', sans-serif; height: 100dvh; width: 100vw;
            display: flex; flex-direction: column;
        }
        
        /* ヘッダーボタンを少し大きく */
        .header-area { height: 60px; display: flex; justify-content: flex-end; align-items: center; padding: 0 15px; gap: 8px; flex-shrink: 0; }
        .util-btn { background: var(--panel-color); color: var(--text-color); border: 2.5px solid #555; padding: 8px 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; }
        
        /* メイン表示エリアの調整 */
        .display-container { flex: 1; display: grid; grid-template-columns: 1fr 2fr 1fr; padding: 0 15px; align-items: center; min-height: 0; gap: 10px; }
        .limit-speed { color: #ff4444; font-size: 3.8rem; font-weight: bold; line-height: 1; }
        
        /* 計器・バー・ノッチ表示の分離 */
        .center-dash { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 25px; }
        #notch-text { font-size: 3.2rem; font-weight: bold; line-height: 1; margin-bottom: 5px; }
        .main-speed { font-size: 8.5rem; font-weight: 800; line-height: 0.7; margin-bottom: 10px; }
        .speed-unit { font-size: 1.8rem; color: #666; }
        .meter-container { width: 90%; height: 26px; background: #333; border-radius: 6px; border: 2px solid #555; overflow: hidden; }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }
        
        /* 区間表示の復活 */
        .right-info { text-align: right; display: flex; flex-direction: column; gap: 3px; }
        #judgment { font-size: 1.8rem; font-weight: 900; height: 2rem; }
        .train-info-small { color: #888; font-size: 1rem; font-weight: bold; }
        
        /* 操作ボタンの大型化（はみ出さないギリギリを攻める） */
        .control-container { height: 230px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 5px 15px 25px 15px; box-sizing: border-box; flex-shrink: 0; }
        .notch-btn { flex: 1; background: var(--panel-color); color: var(--btn-text); border: 3px solid #666; border-radius: 20px; font-size: 3.2rem; font-weight: bold; height: 90%; max-height: 180px; }
        .eb-btn-small { width: 100px; height: 100px; background: #aa0000; border: 5px solid #440000; border-radius: 50%; color: white; font-size: 1.6rem; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #550000; flex-shrink: 0; margin-bottom: 15px; }
        .eb-btn-small.eb-on { background: #ff0000; box-shadow: 0 0 30px #ff0000; border-color: #ffaaaa; transform: scale(1.05); }
    </style>
</head>
<body ontouchstart="">
    <div class="header-area">
        <button class="util-btn" style="color:#ff4444; border-color:#800;" onpointerdown="resetGame()">最初から</button>
        <button class="util-btn" onpointerdown="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onpointerdown="togglePause()">Pause</button>
    </div>
    <div class="display-container">
        <div class="info-box">
            <span style="font-size:1.1rem; color:#888; font-weight: bold;">制限</span><br>
            <span id="limit" class="limit-speed">--</span>
        </div>
        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="main-speed"><span id="speed">0</span><span class="speed-unit">km/h</span></div>
            <div class="meter-container"><div id="notch-bar"></div></div>
        </div>
        <div class="right-info">
            <div style="color:var(--accel-color); font-weight:bold; font-size: 1.3rem;">NEXT: <span id="next-name">---</span></div>
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.1rem;">9431M Expo Liner</div>
            <div class="train-info-small">Osaka → Sakurajima</div>
            <div id="judgment"></div>
            <div id="distance" style="font-size: 2.6rem; font-weight: bold;">-- m</div>
        </div>
    </div>
    <div class="control-container">
        <button class="notch-btn" onpointerdown="changeNotch(1)">▲</button>
        <button id="eb-btn" class="eb-btn-small" onpointerdown="handleEB()">EB</button>
        <button class="notch-btn" onpointerdown="changeNotch(-1)">▼</button>
    </div>

    <script>
        const PARAMS = { accel_power: 0.04, brake_power: 0.08, eb_power: 0.16, friction: 0.003, refresh_ms: 50 };
        const STATIONS = [{ name: "大阪", dist: 0 }, { name: "西九条", dist: 3800 }, { name: "安治川口", dist: 5400 }, { name: "ユニバーサルシティ", dist: 6600 }, { name: "桜島", dist: 7800 }];
        
        let speed = 0, currentPos = 0, notch = -5, isPaused = false, nextStationIdx = 1, lastNotch = 0, hasStopped = false;

        function resetGame() {
            if (confirm("シミュレーションを最初からやり直しますか？")) {
                speed = 0; currentPos = 0; notch = -5; nextStationIdx = 1; hasStopped = false;
                document.getElementById('judgment').innerText = "";
                updateUI();
            }
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function togglePause() { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause'; }
        
        function changeNotch(val) { 
            if (isPaused || notch === -9) return; 
            notch += val; 
            if (notch > 5) notch = 5; if (notch < -8) notch = -8; 
            updateUI(); 
        }

        function handleEB() {
            if (isPaused) return;
            let currentLimit = parseInt(document.getElementById('limit').innerText) || 95;
            if (notch === -9) {
                if (speed <= currentLimit || speed === 0) { notch = lastNotch; }
            } else {
                lastNotch = notch; notch = -9;
            }
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar'), txt = document.getElementById('notch-text'), ebBtn = document.getElementById('eb-btn');
            if (notch === -9) {
                bar.style.width = "100%"; bar.style.backgroundColor = "var(--eb-color)"; 
                txt.innerText = "EB"; txt.style.color = "var(--eb-color)"; 
                ebBtn.classList.add('eb-on');
            } else {
                ebBtn.classList.remove('eb-on');
                if (notch > 0) { 
                    bar.style.width = (notch/5)*100+"%"; bar.style.backgroundColor = "var(--accel-color)"; 
                    txt.innerText = "P"+notch; txt.style.color = "var(--accel-color)"; 
                } else if (notch < 0) { 
                    bar.style.width = (Math.abs(notch)/8)*100+"%"; bar.style.backgroundColor = "var(--brake-color)"; 
                    txt.innerText = "B"+Math.abs(notch); txt.style.color = "var(--brake-color)"; 
                } else { 
                    bar.style.width = "0%"; txt.innerText = "N"; txt.style.color = "var(--text-color)"; 
                }
            }
        }

        setInterval(() => {
            if (isPaused) return;

            if (notch > 0) {
                speed += notch * PARAMS.accel_power;
            } else if (notch < 0) {
                let grip = (speed < 10) ? (1.6 - (speed / 15)) : 1.0;
                let bPower = (notch === -9) ? PARAMS.eb_power : (PARAMS.brake_power / 8);
                speed += notch * bPower * grip;
            }
            speed -= PARAMS.friction;

            if (speed < 0.1) {
                if (speed > 0 && !hasStopped) { checkStopJudgment(); hasStopped = true; }
                speed = 0;
            } else if (speed >= 0.4) {
                document.getElementById('judgment').innerText = "";
                hasStopped = false;
            }
            
            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            let nextS = STATIONS[nextStationIdx], dNext = nextS.dist - currentPos;
            let cLimit = (dNext < 300) ? 25 : (dNext < 800) ? 45 : 95;

            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('limit').innerText = cLimit;
            document.getElementById('next-name').innerText = nextS.name;

            const distEl = document.getElementById('distance');
            if (Math.abs(dNext) <= 5) { distEl.innerText = (dNext * 100).toFixed(1) + " cm"; distEl.style.color = "#fff"; }
            else { distEl.innerText = Math.floor(dNext) + " m"; distEl.style.color = ""; }

            if (speed > cLimit && notch !== -9) { lastNotch = notch; notch = -9; updateUI(); }
            if (notch === -9 && speed <= cLimit - 20 && speed > 0) { notch = lastNotch; updateUI(); }

            if (dNext < -10 && nextStationIdx < STATIONS.length - 1) {
                nextStationIdx++;
                document.getElementById('judgment').innerText = "";
                hasStopped = false;
            }
        }, PARAMS.refresh_ms);

        function checkStopJudgment() {
            let diff = Math.abs(STATIONS[nextStationIdx].dist - currentPos) * 100;
            let judgeEl = document.getElementById('judgment');
            if (diff < 15) { judgeEl.innerText = "EXCELLENT"; judgeEl.style.color = "#00ffff"; }
            else if (diff < 40) { judgeEl.innerText = "GREAT"; judgeEl.style.color = "var(--accel-color)"; }
            else if (diff < 150) { judgeEl.innerText = "GOOD"; judgeEl.style.color = "#fff"; }
            else { judgeEl.innerText = "BAD"; judgeEl.style.color = "var(--eb-color)"; }
        }
        updateUI();
    </script>
</body>
</html>
