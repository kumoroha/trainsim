<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #1a1a1a;
            --text-color: #e0e0e0;
            --btn-text: #ffffff;
            --accel-color: #00ff66;
            --brake-color: #ffaa00;
            --eb-color: #ff0000;
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-color: #ffffff;
            --text-color: #222222;
            --btn-text: #222222;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
            /* iPadでの画面全体の高さを固定 */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 上部エリア */
        .display-container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            height: 45vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .info-box { display: flex; flex-direction: column; justify-content: center; }
        .limit-speed { color: #ff4444; font-size: 4rem; font-weight: bold; }
        
        .center-dash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* 速度表示：km/hを横に小さく配置 */
        .speed-display-group {
            display: flex;
            align-items: baseline;
        }
        .main-speed { font-size: 9rem; font-weight: 800; line-height: 1; }
        .speed-unit { font-size: 1.5rem; color: #666; margin-left: 10px; }

        /* メーター */
        .meter-container {
            width: 80%;
            height: 25px;
            background: #333;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
            border: 1px solid #555;
        }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }

        /* ユーティリティボタン */
        .utils {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .util-btn {
            background: var(--panel-color);
            color: var(--text-color);
            border: 1px solid #555;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
        }

        /* 下部：操作エリア（iPad A16等のセーフエリアを考慮した余白） */
        .control-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex-grow: 1; /* 残りのスペースをすべて使う */
            gap: 20px;
            padding: 20px 20px 40px 20px; /* 下部余白(40px)をしっかり確保 */
            box-sizing: border-box;
            background: rgba(0,0,0,0.1);
        }

        .notch-btn {
            background: var(--panel-color);
            color: var(--btn-text);
            border: 2px solid #555;
            border-radius: 25px;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            height: 100%;
        }
        .notch-btn:active { transform: scale(0.98); background: #444; }

        #notch-text {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="utils">
        <button class="util-btn" onclick="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onclick="togglePause()">Pause</button>
    </div>

    <div class="display-container">
        <div class="info-box">
            <span style="font-size:0.9rem; color:#888;">制限</span>
            <span id="limit" class="limit-speed">--</span>
        </div>

        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="speed-display-group">
                <div id="speed" class="main-speed">0</div>
                <div class="speed-unit">km/h</div>
            </div>
            <div class="meter-container">
                <div id="notch-bar"></div>
            </div>
        </div>

        <div class="info-box" style="text-align:right; line-height: 1.4;">
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.2rem;">EXPO LINER</div>
            <div style="color:#aaa; font-size: 0.9rem;">大阪 → 桜島</div>
            <div id="distance" style="font-size: 2rem; margin-top:15px; font-weight: bold;">5.40 km</div>
        </div>
    </div>

    <div class="control-container">
        <button class="notch-btn" onclick="changeNotch(1)">▲ 加速</button>
        <button class="notch-btn" onclick="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        const PARAMS = {
            accel_power: 0.04,
            brake_power: 0.07,
            eb_power: 0.25,
            friction: 0.003,
            refresh_ms: 50
        };

        let speed = 0;
        let distance = 5400;
        let notch = 0;
        let isPaused = false;

        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
            document.getElementById('pause-btn').style.backgroundColor = isPaused ? '#ff4444' : '';
        }

        function changeNotch(val) {
            if (isPaused) return;
            notch += val;
            if (notch > 5) notch = 5;
            if (notch < -9) notch = -9;
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar');
            const txt = document.getElementById('notch-text');
            
            if (notch > 0) {
                bar.style.width = (notch / 5) * 100 + "%";
                bar.style.backgroundColor = "var(--accel-color)";
                txt.innerText = "P" + notch;
                txt.style.color = "var(--accel-color)";
            } else if (notch < 0) {
                let isEB = (notch === -9);
                bar.style.width = (Math.abs(notch) / 9) * 100 + "%";
                bar.style.backgroundColor = isEB ? "var(--eb-color)" : "var(--brake-color)";
                txt.innerText = isEB ? "EB" : "B" + Math.abs(notch);
                txt.style.color = isEB ? "var(--eb-color)" : "var(--brake-color)";
            } else {
                bar.style.width = "0%";
                txt.innerText = "N";
                txt.style.color = "var(--text-color)";
            }
        }

        setInterval(() => {
            if (isPaused) return;

            if (notch > 0) {
                speed += notch * PARAMS.accel_power;
            } else if (notch < 0) {
                let power = (notch === -9) ? PARAMS.eb_power : PARAMS.brake_power;
                speed += notch * power;
            }
            
            speed -= PARAMS.friction;
            if (speed < 0) speed = 0;

            distance -= (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            if (distance < 0) distance = 0;

            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('distance').innerText = (distance / 1000).toFixed(2) + " km";

            if (distance > 5000) document.getElementById('limit').innerText = "25";
            else if (distance > 4500) document.getElementById('limit').innerText = "45";
            else document.getElementById('limit').innerText = "95";

        }, PARAMS.refresh_ms);

        updateUI();
    </script>
</body>
</html>
