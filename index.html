<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #1a1a1a;
            --text-color: #e0e0e0;
            --btn-text: #ffffff;
            --accel-color: #00ff66;
            --brake-color: #ffaa00;
            --eb-color: #ff0000;
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-color: #ffffff;
            --text-color: #222222;
            --btn-text: #222222;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* 1. ユーティリティ（高さ固定：50px） */
        .utils {
            height: 50px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            flex-shrink: 0;
        }
        .util-btn {
            background: var(--panel-color);
            color: var(--text-color);
            border: 1px solid #555;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        /* 2. 計器表示（残りの高さをボタンと分かち合う） */
        .display-container {
            flex: 1; /* 柔軟に広がる */
            display: grid;
            grid-template-columns: 1fr 1.8fr 1fr;
            padding: 0 20px;
            box-sizing: border-box;
            align-items: center;
            min-height: 0; /* overflow防止 */
        }

        .info-box { display: flex; flex-direction: column; justify-content: center; }
        .limit-speed { color: #ff4444; font-size: 4rem; font-weight: bold; line-height: 1; }
        
        .center-dash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #notch-text { 
            font-size: 2.5rem; 
            font-weight: bold; 
            margin-bottom: 15px;
        }
        
        .main-speed { font-size: 8rem; font-weight: 800; line-height: 0.8; }
        .speed-unit { font-size: 1.5rem; color: #666; }

        .meter-container {
            width: 90%;
            height: 20px;
            background: #333;
            border-radius: 6px;
            margin-top: 20px;
            border: 2px solid #555;
            overflow: hidden;
        }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }

        /* 3. 操作パネル（画面下部に固定。iPadのホームバーを考慮） */
        .control-container {
            height: 40vh; /* 高さを40%に固定 */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 10px 20px 35px 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .notch-btn {
            background: var(--panel-color);
            color: var(--btn-text);
            border: 2px solid #555;
            border-radius: 20px;
            font-size: 2.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .notch-btn:active { background: #555; transform: scale(0.97); }

    </style>
</head>
<body ontouchstart="">

    <div class="utils">
        <button class="util-btn" onclick="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onclick="togglePause()">Pause</button>
    </div>

    <div class="display-container">
        <div class="info-box">
            <span style="font-size:1rem; color:#888;">制限</span>
            <span id="limit" class="limit-speed">--</span>
        </div>

        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="main-speed"><span id="speed">0</span><span class="speed-unit"> km/h</span></div>
            <div class="meter-container">
                <div id="notch-bar"></div>
            </div>
        </div>

        <div class="info-box" style="text-align:right; line-height: 1.3;">
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.2rem;">9431M エキスポライナー</div>
            <div id="section-name" style="color:#aaa; font-size: 1rem;">大阪 → 西九条</div>
            <div id="distance" style="font-size: 2rem; margin-top:8px; font-weight: bold;">-- m</div>
        </div>
    </div>

    <div class="control-container">
        <button class="notch-btn" onclick="changeNotch(1)">▲ 加速</button>
        <button class="notch-btn" onclick="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        const PARAMS = { accel_power: 0.04, brake_power: 0.07, eb_power: 0.25, friction: 0.003, refresh_ms: 50 };
        const STATIONS = [
            { name: "大阪", dist: 0 },
            { name: "西九条", dist: 3800 },
            { name: "安治川口", dist: 5400 },
            { name: "ユニバーサルシティ", dist: 6600 },
            { name: "桜島", dist: 7800 }
        ];

        let speed = 0, currentPos = 0, notch = -5, isPaused = false, nextStationIdx = 1;

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
            document.getElementById('pause-btn').style.backgroundColor = isPaused ? '#ff4444' : '';
        }

        function changeNotch(val) {
            if (isPaused) return;
            notch += val;
            if (notch > 5) notch = 5;
            if (notch < -9) notch = -9;
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar'), txt = document.getElementById('notch-text');
            if (notch > 0) {
                bar.style.width = (notch / 5) * 100 + "%";
                bar.style.backgroundColor = "var(--accel-color)";
                txt.innerText = "P" + notch;
                txt.style.color = "var(--accel-color)";
            } else if (notch < 0) {
                let isEB = (notch === -9);
                bar.style.width = (Math.abs(notch) / 9) * 100 + "%";
                bar.style.backgroundColor = isEB ? "var(--eb-color)" : "var(--brake-color)";
                txt.innerText = isEB ? "EB" : "B" + Math.abs(notch);
                txt.style.color = isEB ? "var(--eb-color)" : "var(--brake-color)";
            } else {
                bar.style.width = "0%";
                txt.innerText = "N";
                txt.style.color = "var(--text-color)";
            }
        }

        setInterval(() => {
            if (isPaused) return;
            if (notch > 0) speed += notch * PARAMS.accel_power;
            else if (notch < 0) speed += notch * ((notch === -9) ? PARAMS.eb_power : PARAMS.brake_power);
            speed -= PARAMS.friction;
            if (speed < 0) speed = 0;
            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            
            let nextStation = STATIONS[nextStationIdx], distToNext = nextStation.dist - currentPos;
            if (distToNext < 0) {
                if (nextStationIdx < STATIONS.length - 1) {
                    nextStationIdx++;
                    nextStation = STATIONS[nextStationIdx];
                    distToNext = nextStation.dist - currentPos;
                } else { distToNext = 0; speed = 0; }
            }
            
            document.getElementById('speed').innerText = Math.floor(speed);
            // 単位をmに変更し、小数点なしの整数表示
            document.getElementById('distance').innerText = Math.floor(distToNext) + " m";
            document.getElementById('section-name').innerText = STATIONS[nextStationIdx-1].name + " → " + nextStation.name;
            
            if (distToNext < 300) document.getElementById('limit').innerText = "25";
            else if (distToNext < 800) document.getElementById('limit').innerText = "45";
            else document.getElementById('limit').innerText = "95";
        }, PARAMS.refresh_ms);

        // 初期表示反映
        updateUI();
    </script>
</body>
</html>
