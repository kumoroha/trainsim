<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Expo Liner Simulator Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #1a1a1a;
            --text-color: #e0e0e0;
            --btn-text: #ffffff;
            --accel-color: #00ff66;
            --brake-color: #ffaa00;
            --eb-color: #ff0000;
        }

        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-color: #ffffff;
            --text-color: #222222;
            --btn-text: #222222;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* 1. ユーティリティ（ボタンサイズ維持、文字のみ拡大） */
        .utils {
            height: 50px; 
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            flex-shrink: 0;
        }
        .util-btn {
            background: var(--panel-color);
            color: var(--text-color);
            border: 2px solid #555;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem; /* 文字を少し大きく */
            font-weight: 900;  /* 太字で強調 */
            cursor: pointer;
        }

        /* 2. 計器表示（理想の巨大サイズと空白） */
        .display-container {
            flex: 1; 
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            padding: 0 25px;
            align-items: center;
            min-height: 0;
        }

        .limit-speed { color: #ff4444; font-size: 4.2rem; font-weight: bold; line-height: 1; }
        
        .center-dash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        #notch-text { font-size: 3.8rem; font-weight: bold; line-height: 1; }
        .main-speed { font-size: 10rem; font-weight: 800; line-height: 0.75; }
        .speed-unit { font-size: 2rem; color: #666; }

        .meter-container {
            width: 100%; height: 24px;
            background: #333;
            border-radius: 6px;
            border: 2px solid #555;
            overflow: hidden;
        }
        #notch-bar { height: 100%; width: 0%; transition: width 0.1s; }

        /* 3. 操作パネル（中央にEBボタンを配置） */
        .control-container {
            height: 220px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 10px 20px 30px 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .notch-btn {
            flex: 1;
            background: var(--panel-color);
            color: var(--btn-text);
            border: 2px solid #555;
            border-radius: 20px;
            font-size: 2.8rem;
            font-weight: bold;
            height: 100%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }

        /* JR西日本風 EBボタン（小型・中央） */
        .eb-btn-small {
            width: 80px;
            height: 80px;
            background: #cc0000;
            border: 6px solid #ffcc00; /* 黄色い枠 */
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #800000;
            flex-shrink: 0;
            margin-bottom: 20px; /* 少し浮かせる */
        }
        .eb-btn-small:active {
            transform: translateY(4px);
            box-shadow: none;
        }

    </style>
</head>
<body>

    <div class="utils">
        <button class="util-btn" onpointerdown="toggleTheme()">Theme</button>
        <button id="pause-btn" class="util-btn" onpointerdown="togglePause()">Pause</button>
    </div>

    <div class="display-container">
        <div class="info-box">
            <span style="font-size:1.2rem; color:#888; font-weight: bold;">制限</span>
            <span id="limit" class="limit-speed">--</span>
        </div>

        <div class="center-dash">
            <div id="notch-text">N</div>
            <div class="main-speed"><span id="speed">0</span><span class="speed-unit"> km/h</span></div>
            <div class="meter-container">
                <div id="notch-bar"></div>
            </div>
        </div>

        <div class="info-box" style="text-align:right;">
            <div style="color:var(--brake-color); font-weight:bold; font-size: 1.4rem;">9431M Expo Liner</div>
            <div id="section-name" style="color:#aaa; font-size: 1.1rem;">Osaka → Nishi-Kujo</div>
            <div id="distance" style="font-size: 2.5rem; margin-top:8px; font-weight: bold;">-- m</div>
        </div>
    </div>

    <div class="control-container">
        <button class="notch-btn" onpointerdown="changeNotch(1)">▲ 加速</button>
        <button class="eb-btn-small" onpointerdown="setEB()">EB</button>
        <button class="notch-btn" onpointerdown="changeNotch(-1)">▼ 減速</button>
    </div>

    <script>
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        const PARAMS = { accel_power: 0.04, brake_power: 0.07, eb_power: 0.35, friction: 0.003, refresh_ms: 50 };
        const STATIONS = [
            { name: "大阪", dist: 0 },
            { name: "西九条", dist: 3800 },
            { name: "安治川口", dist: 5400 },
            { name: "ユニバーサルシティ", dist: 6600 },
            { name: "桜島", dist: 7800 }
        ];

        let speed = 0, currentPos = 0, notch = -5, isPaused = false, nextStationIdx = 1;

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? 'Resume' : 'Pause';
        }

        function changeNotch(val) {
            if (isPaused) return;
            notch += val;
            if (notch > 5) notch = 5;
            if (notch < -9) notch = -9;
            updateUI();
        }

        function setEB() {
            if (isPaused) return;
            notch = -9;
            updateUI();
        }

        function updateUI() {
            const bar = document.getElementById('notch-bar'), txt = document.getElementById('notch-text');
            if (notch > 0) {
                bar.style.width = (notch / 5) * 100 + "%";
                bar.style.backgroundColor = "var(--accel-color)";
                txt.innerText = "P" + notch;
                txt.style.color = "var(--accel-color)";
            } else if (notch < 0) {
                let isEB = (notch === -9);
                bar.style.width = (Math.abs(notch) / 9) * 100 + "%";
                bar.style.backgroundColor = isEB ? "var(--eb-color)" : "var(--brake-color)";
                txt.innerText = isEB ? "EB" : "B" + Math.abs(notch);
                txt.style.color = isEB ? "var(--eb-color)" : "var(--brake-color)";
            } else {
                bar.style.width = "0%";
                txt.innerText = "N";
                txt.style.color = "var(--text-color)";
            }
        }

        setInterval(() => {
            if (isPaused) return;
            if (notch > 0) speed += notch * PARAMS.accel_power;
            else if (notch < 0) speed += notch * ((notch === -9) ? PARAMS.eb_power : PARAMS.brake_power);
            speed -= PARAMS.friction;
            if (speed < 0) speed = 0;
            currentPos += (speed / 3.6) * (PARAMS.refresh_ms / 1000);
            
            let nextStation = STATIONS[nextStationIdx], distToNext = nextStation.dist - currentPos;
            if (distToNext < 0) {
                if (nextStationIdx < STATIONS.length - 1) {
                    nextStationIdx++;
                    nextStation = STATIONS[nextStationIdx];
                    distToNext = nextStation.dist - currentPos;
                } else { distToNext = 0; speed = 0; }
            }
            document.getElementById('speed').innerText = Math.floor(speed);
            document.getElementById('distance').innerText = Math.floor(distToNext) + " m";
            document.getElementById('section-name').innerText = STATIONS[nextStationIdx-1].name + " → " + nextStation.name;
            
            if (distToNext < 300) document.getElementById('limit').innerText = "25";
            else if (distToNext < 800) document.getElementById('limit').innerText = "45";
            else document.getElementById('limit').innerText = "95";
        }, PARAMS.refresh_ms);
        updateUI();
    </script>
</body>
</html>
